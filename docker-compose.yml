services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: intlmatchpredictor:latest
    environment:
      BAYESIAN_CORES: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Override the host port with: API_PORT=9000 docker compose up
      - "${API_PORT:-8000}:8000"
    volumes:
      # data/, models/, and figures/ are named volumes, not bind mounts.
      #
      # They started as bind mounts (./data:/app/data etc.) so their
      # contents were directly browsable from the host. That broke on at
      # least one real host: `docker compose up` alone can't guarantee
      # `predictor` can write into a bind-mounted directory, because Docker
      # doesn't remap bind-mount ownership to match a baked-in image UID —
      # the container sees ./data with whatever UID owns it on the host.
      # The standard fix for that is chowning the mount inside the
      # container at startup (see docker-entrypoint.sh, which still does
      # this as a harmless no-op/best-effort). But on a host where the
      # Docker daemon has userns-remap enabled (or a similar restriction —
      # e.g. an NFS-backed project directory with root_squash), even a
      # process that reports itself as uid=0 inside the container has no
      # real authority over the bind-mounted host path, and chown fails
      # with Permission denied — no in-container command, run as any user,
      # can fix that; it's enforced above the container entirely.
      #
      # Named volumes sidestep this completely: Docker's own daemon (not
      # subject to that restriction) creates and seeds them directly from
      # the image's own /app/data, /app/models, /app/figures directories —
      # which the Dockerfile already creates pre-owned by `predictor` — so
      # they come in correctly-owned with zero runtime chown needed, on
      # every host, regardless of userns-remap or anything else. This is
      # exactly why pytensor_cache below (also a named volume, not a bind
      # mount) never had this problem in the first place.
      #
      # Trade-off: these are no longer plain folders you can `ls` or open
      # in a file manager. To pull the current figures out for viewing:
      #   docker compose cp api:/app/figures ./figures-export
      - data:/app/data
      - models:/app/models
      - figures:/app/figures
      # PyTensor's compiled-C-extension cache. Only useful once the
      # Dockerfile's runtime stage has a compiler (g++) installed — without
      # one PyTensor never populates this directory. Persisting it avoids
      # paying the JIT-compilation cost again on every container restart.
      - pytensor_cache:/app/.pytensor_cache
    restart: unless-stopped

volumes:
  data:
  models:
  figures:
  pytensor_cache: